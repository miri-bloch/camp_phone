<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>למען תורתך — דשבורד התרמות</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- שכבת טעינה — מוצגת עד שהנתונים מגיעים -->
    <div class="loading-overlay" id="loading-overlay">
        <img src="/IMG.png" alt="למען תורתך" class="loading-logo">
        <div class="loading-label">טוען נתונים…</div>
    </div>

    <!-- קונפטי נופל -->
    <div class="confetti-container"></div>

    <!-- הדשבורד -->
    <div class="dashboard">
        <!-- כותרת -->
        <header class="header-gold">
            <div class="logo-area">
                <img src="/IMG.png" alt="למען תורתך" class="logo-img">
            </div>
            <h1>מסע התרמות</h1>
            <div class="subtitle">בנות סמינר פוירשטיין</div>
        </header>

        <!-- כרטיסי הנתונים -->
        <div class="cards">
            <div class="card highlight">
                <span class="card-label">סה״כ גויס</span>
                <span class="card-value" id="total-amount">₪ 0</span>
            </div>
            <div class="card">
                <span class="card-label">היעד</span>
                <span class="card-value" id="target">₪ 0</span>
            </div>
            <div class="card">
                <span class="card-label">אחוז גיוס</span>
                <span class="card-value" id="progress">0%</span>
            </div>
        </div>

        <!-- פס התקדמות -->
        <div class="progress-bar">
            <div class="progress-fill" id="progress-fill"></div>
        </div>

        <!-- עשרת המובילות -->
        <section class="top-ten">
            <h2>🏆 עשר המובילות 🏆</h2>
            <ul id="top-list"></ul>
        </section>
    </div>

    <!-- רשימה דינמית בצד -->
    <aside class="side-ticker">
        <div class="side-ticker-head">🏅 התורמות 🏅</div>
        <div class="side-ticker-viewport">
            <ul class="side-ticker-list" id="side-ticker-list"></ul>
        </div>
    </aside>

    <script src="app.js"></script>
</body>
</html>
